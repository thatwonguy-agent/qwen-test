version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=${BACKEND_PORT:-8080}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/appdb}
      - JWT_SECRET=${JWT_SECRET:-fallback-secret-use-env-var-in-production}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - postgres
    networks:
      - qwen-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080/api}
      - VITE_SOCKET_URL=${VITE_SOCKET_URL:-http://localhost:8080}
    depends_on:
      - backend
    networks:
      - qwen-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-in-production}
      - POSTGRES_DB=${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qwen-network

volumes:
  postgres_data:

networks:
  qwen-network:
    driver: bridge
